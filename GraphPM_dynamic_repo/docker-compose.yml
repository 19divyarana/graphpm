services:
  neo4j:
    image: neo4j:5.26-community
    container_name: graphpm-neo4j
    environment:
      NEO4J_AUTH: neo4j/graphpm2005
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
  backend:
    build: ./backend
    container_name: graphpm-api
    environment:
      DATABASE_URL: sqlite:////app/data/graphpm.db
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graphpm2005
      MODEL_PATH: /app/artifacts/risk_model.joblib
    volumes:
      - ./runtime:/app/data
      - ./runtime/artifacts:/app/artifacts
    ports:
      - "8000:8000"
    depends_on:
      - neo4j
  frontend:
    build: ./frontend
    container_name: graphpm-ui
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  neo4j_data:
